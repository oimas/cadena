server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;

    # La home es index.html (redirector → mapa.html).
    # Abrir mdea.intismart.com cae en el redirector y salta al mapa.
    index  index.html;

    # Los archivos son grandes (HTML ~28 MB, indices_data.js ~10 MB).
    # gzip baja la transferencia a una fracción y acelera la 1ª carga.
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/html text/css application/javascript application/json image/svg+xml;
    gzip_vary         on;

    # URL limpia: mdea.intismart.com/mapa sirve mapa.html sin mostrar
    # la extensión ni redireccionar (el navegador conserva /mapa en la barra).
    location = /mapa {
        try_files /mapa.html =404;
    }

    # Servicio de render (exportar_mapa.py, dentro de este mismo contenedor).
    # Se expone bajo el MISMO origen del sitio: el visor no puede llamar a un
    # 127.0.0.1 del visitante — los navegadores lo bloquean (Private Network
    # Access) — así que el render tiene que responder desde acá.
    location /exportador/ {
        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La selección con el río activo son varios MB de geometría.
        client_max_body_size 128m;
        # Un A3 a 300 dpi puede tardar bastante en un servidor chico: el
        # default de 60 s cortaría el render a mitad de camino.
        proxy_connect_timeout 30s;
        proxy_send_timeout   600s;
        proxy_read_timeout   600s;
        # El PNG sale de una sola pieza; sin buffering empieza a fluir antes.
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
